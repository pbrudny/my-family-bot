services:
  neo4j:
    image: neo4j:5.24
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache__size: 128m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      coolify:
        aliases:
          - rodzina-walachow-neo4j

networks:
  coolify:
    external: true

volumes:
  neo4j_data:
  neo4j_logs:
